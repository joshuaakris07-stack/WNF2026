server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inject the completion hotfix after the original inline CSS/JS so it wins
    # without risking another large rewrite of index.html.
    sub_filter '</head>' '<link rel="stylesheet" href="/assets/completion-fix.css?v=8"><link rel="stylesheet" href="/assets/sharp-background.css?v=4"></head>';
    sub_filter '</body>' '<script src="/assets/completion-fix.js?v=8"></script><script src="/assets/correct-sound.js?v=1"></script></body>';
    sub_filter_once on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The background changes during design work, so never keep an immutable stale copy.
    location = /assets/background.webp {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
