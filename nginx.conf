server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inject the completion hotfix after the original inline CSS/JS so it wins
    # without risking another large rewrite of index.html.
    sub_filter '</head>' '<link rel="stylesheet" href="/assets/completion-fix.css?v=6"></head>';
    sub_filter '</body>' '<script src="/assets/completion-fix.js?v=6"></script></body>';
    sub_filter_once on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
